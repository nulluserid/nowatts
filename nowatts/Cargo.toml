[package]
name = "nowatts"
version = "0.1.0"
edition = "2021"
description = "Plain-English USB-C power status daemon for Omarchy"
license = "MIT"

# Design rule (SPEC FR-001/002): read-only, event-driven, no async runtime.
# Two threads: a blocking uevent watcher + a main loop with a 30s heartbeat.
[dependencies]
udev = "0.9"                                     # uevent watching (pkg-config + libudev, shipped by systemd)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
